name: Supply-chain security
on:
  push: { branches: [main] }
  pull_request:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npx lockfile-lint --path package-lock.json --type npm --validate-https --allowed-hosts npm
      - run: npm audit --audit-level=critical # TODO: restore --audit-level=high after Next 16 upgrade (#<issue>). 10 highs are Next/eslint-config-next, tracked.
